      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">Multi-Agent (A2A) Pattern — Deal Sourcing</text>
  <rect x="420" y="100" width="360" height="100" rx="12" fill="#0b3d2e"/>
  <text x="460" y="160" class="t b" fill="#f7f5f0">Orchestrator Agent</text>
  <rect x="60" y="280" width="300" height="140" rx="12" class="card"/>
  <text x="90" y="340" class="t b">News Monitor</text>
  <text x="90" y="375" class="t s">Global feeds → flags</text>
  <rect x="450" y="280" width="300" height="140" rx="12" class="card"/>
  <text x="480" y="340" class="t b">Restructuring Scout</text>
  <text x="480" y="375" class="t s">Score opportunity</text>
  <rect x="840" y="280" width="300" height="140" rx="12" class="card"/>
  <text x="870" y="340" class="t b">Dossier Compiler</text>
  <text x="870" y="375" class="t s">Draft for Debt Advisory</text>
  <path d="M600 200 V280" class="line"/>
  <path d="M210 280 V240 H990 V280" class="line"/>
  <rect x="60" y="480" width="1080" height="120" rx="12" class="card"/>
  <text x="90" y="535" class="t s">Shared tools via MCP • human approval before client outreach • clear ownership of each hop</text>

