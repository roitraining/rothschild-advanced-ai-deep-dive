<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a2332; }
      .h { font-size: 28px; font-weight: 700; }
      .b { font-size: 18px; font-weight: 600; }
      .s { font-size: 15px; fill: #3d4a5c; }
      .w { fill: #f7f5f0; }
      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">RAG Pipeline (Retrieval-Augmented Generation)</text>
  <rect x="60" y="140" width="200" height="100" rx="10" class="card"/>
  <text x="85" y="185" class="t b">1. Ingest</text>
  <text x="85" y="215" class="t s">Docs → chunks</text>
  <text x="280" y="190" class="t h">→</text>
  <rect x="320" y="140" width="200" height="100" rx="10" class="card"/>
  <text x="345" y="185" class="t b">2. Embed</text>
  <text x="345" y="215" class="t s">Vectors + metadata</text>
  <text x="540" y="190" class="t h">→</text>
  <rect x="580" y="140" width="200" height="100" rx="10" class="card"/>
  <text x="605" y="185" class="t b">3. Retrieve</text>
  <text x="605" y="215" class="t s">Top-k relevant</text>
  <text x="800" y="190" class="t h">→</text>
  <rect x="840" y="140" width="280" height="100" rx="10" fill="#0b3d2e"/>
  <text x="865" y="185" class="t b" fill="#f7f5f0">4. Generate</text>
  <text x="865" y="215" class="t s" fill="#dce8e2">Answer + citations</text>
  <rect x="60" y="300" width="1060" height="280" rx="12" class="card"/>
  <text x="90" y="355" class="t b">Finance example: internal credit memo Q&amp;A</text>
  <text x="90" y="405" class="t s">Query: "What leverage covenants apply if EBITDA dips 15%?"</text>
  <text x="90" y="450" class="t s">Retrieve: facility agreement sections + prior memos with matching metadata</text>
  <text x="90" y="495" class="t s">Generate: answer grounded in retrieved clauses, with source pointers</text>
  <text x="90" y="540" class="t s">Fail closed: if retrieval is weak, say so—do not invent covenant language</text>

</svg>