<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a2332; }
      .h { font-size: 28px; font-weight: 700; }
      .b { font-size: 18px; font-weight: 600; }
      .s { font-size: 15px; fill: #3d4a5c; }
      .w { fill: #f7f5f0; }
      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">MCP: Model Context Protocol</text>
  <rect x="80" y="130" width="280" height="160" rx="12" class="card"/>
  <text x="110" y="195" class="t b">AI Host / Agent</text>
  <text x="110" y="230" class="t s">Copilot, Cursor, custom</text>
  <text x="400" y="210" class="t h">⟷</text>
  <rect x="460" y="130" width="280" height="160" rx="12" fill="#0b3d2e"/>
  <text x="490" y="195" class="t b" fill="#f7f5f0">MCP Server</text>
  <text x="490" y="230" class="t s" fill="#dce8e2">Standardized tools,</text>
  <text x="490" y="255" class="t s" fill="#dce8e2">resources, prompts</text>
  <text x="780" y="210" class="t h">⟷</text>
  <rect x="840" y="100" width="280" height="90" rx="10" class="card"/>
  <text x="865" y="155" class="t b">CRM / Deal DB</text>
  <rect x="840" y="210" width="280" height="90" rx="10" class="card"/>
  <text x="865" y="265" class="t b">Document store</text>
  <rect x="840" y="320" width="280" height="90" rx="10" class="card"/>
  <text x="865" y="375" class="t b">Market data API</text>
  <rect x="80" y="360" width="660" height="220" rx="12" class="card"/>
  <text x="110" y="410" class="t b">Enterprise value</text>
  <text x="110" y="455" class="t s">• One protocol instead of one-off tool integrations per app</text>
  <text x="110" y="495" class="t s">• Permissions stay with the data service, not the prompt</text>
  <text x="110" y="535" class="t s">• Agents discover capabilities dynamically (tools + resources)</text>

</svg>