<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a2332; }
      .h { font-size: 28px; font-weight: 700; }
      .b { font-size: 18px; font-weight: 600; }
      .s { font-size: 15px; fill: #3d4a5c; }
      .w { fill: #f7f5f0; }
      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">Multimodal Inputs → One Reasoning Surface</text>
  <rect x="80" y="140" width="240" height="160" rx="12" class="card"/>
  <text x="110" y="215" class="t b">Speech / Audio</text>
  <text x="110" y="250" class="t s">Earnings calls</text>
  <rect x="360" y="140" width="240" height="160" rx="12" class="card"/>
  <text x="390" y="215" class="t b">Vision</text>
  <text x="390" y="250" class="t s">Charts, decks</text>
  <rect x="640" y="140" width="240" height="160" rx="12" class="card"/>
  <text x="670" y="215" class="t b">Video</text>
  <text x="670" y="250" class="t s">CEO delivery</text>
  <rect x="920" y="140" width="200" height="160" rx="12" class="card"/>
  <text x="945" y="215" class="t b">Text</text>
  <text x="945" y="250" class="t s">Transcripts</text>
  <rect x="300" y="360" width="600" height="120" rx="12" fill="#0b3d2e"/>
  <text x="360" y="430" class="t b" fill="#f7f5f0">Unified model / pipeline → insights</text>
  <rect x="200" y="520" width="800" height="90" rx="12" class="card"/>
  <text x="240" y="575" class="t s">Sentiment • strategic shifts • exec podcast summary</text>

</svg>