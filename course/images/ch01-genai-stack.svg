<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <defs>
    <filter id="elev1" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#202124" flood-opacity="0.16"/>
    </filter>
    <filter id="elev2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202124" flood-opacity="0.18"/>
    </filter>
    <style type="text/css"><![CDATA[
      .title { font-family: Roboto, 'Google Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #202124; }
      .sub { font-family: Roboto, Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #5F6368; }
      .h2 { font-family: Roboto, 'Google Sans', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #202124; }
      .h3 { font-family: Roboto, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #5F6368; }
      .body-ink { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #202124; }
      .label { font-family: Roboto, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #5F6368; letter-spacing: 1.2px; }
      .chip { font-family: Roboto, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .num { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .num-dark { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #202124; }
      .on-dark { fill: #FFFFFF; }
    ]]></style>
  </defs>
  <rect width="1200" height="675" fill="#F8F9FA"/>
  <text x="48" y="48" class="title">The Generative AI Stack</text>
  <text x="48" y="78" class="sub">Five layers from user-facing agents down to trust boundaries</text>

  <rect x="48" y="100" width="1104" height="100" rx="20" fill="#E8F0FE" filter="url(#elev2)"/>
  <circle cx="108" cy="150" r="28" fill="#4285F4"/>
  <g transform="translate(98,140)">
    <rect x="1" y="1" width="7" height="7" rx="1.5" fill="#FFFFFF"/>
    <rect x="12" y="1" width="7" height="7" rx="1.5" fill="#FFFFFF"/>
    <rect x="1" y="12" width="7" height="7" rx="1.5" fill="#FFFFFF"/>
    <rect x="12" y="12" width="7" height="7" rx="1.5" fill="#FFFFFF"/></g>
  <text x="160" y="140" class="h2">Applications &amp; Agents</text>
  <text x="160" y="168" class="body-ink">Copilots, deal workflows, multi-agent systems</text>
  <rect x="760" y="128" width="360" height="44" rx="22" fill="#FFFFFF"/>
  <text x="940" y="156" text-anchor="middle" class="chip" fill="#5F6368">Research briefs · dossiers · client communications</text>

  <rect x="48" y="212" width="1104" height="100" rx="20" fill="#E6F4EA" filter="url(#elev2)"/>
  <circle cx="108" cy="262" r="28" fill="#34A853"/>
  <g transform="translate(97,251)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
    <line x1="3" y1="6" x2="19" y2="6"/><circle cx="8" cy="6" r="2.5" fill="#FFFFFF" stroke="none"/>
    <line x1="3" y1="16" x2="19" y2="16"/><circle cx="14" cy="16" r="2.5" fill="#FFFFFF" stroke="none"/></g>
  <text x="160" y="252" class="h2">Orchestration &amp; Tools</text>
  <text x="160" y="280" class="body-ink">APIs, MCP, RAG, skills, and guardrails</text>
  <rect x="760" y="240" width="360" height="44" rx="22" fill="#FFFFFF"/>
  <text x="940" y="268" text-anchor="middle" class="chip" fill="#5F6368">Where enterprise data and controls attach</text>

  <rect x="48" y="324" width="1104" height="100" rx="20" fill="#FEF7E0" filter="url(#elev2)"/>
  <circle cx="108" cy="374" r="28" fill="#FBBC04"/>
  <g transform="translate(97,363)">
    <rect x="3" y="4" width="16" height="14" rx="3" fill="none" stroke="#202124" stroke-width="2"/>
    <circle cx="8" cy="11" r="1.6" fill="#202124"/><circle cx="12" cy="11" r="1.6" fill="#202124"/><circle cx="16" cy="11" r="1.6" fill="#202124"/>
    <path d="M8 11h8" stroke="#202124" stroke-width="1.5"/></g>
  <text x="160" y="364" class="h2">Model Layer</text>
  <text x="160" y="392" class="body-ink">Frontier · open-weight · specialized · multimodal</text>
  <rect x="760" y="352" width="360" height="44" rx="22" fill="#FFFFFF"/>
  <text x="940" y="380" text-anchor="middle" class="chip" fill="#5F6368">Choose by reasoning, latency, residency, cost</text>

  <rect x="48" y="436" width="1104" height="100" rx="20" fill="#FCE8E6" filter="url(#elev2)"/>
  <circle cx="108" cy="486" r="28" fill="#EA4335"/>
  <g transform="translate(97,475)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <ellipse cx="11" cy="6" rx="7" ry="3"/><path d="M4 6v8c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/>
    <path d="M4 10c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g>
  <text x="160" y="476" class="h2">Data &amp; Infrastructure</text>
  <text x="160" y="504" class="body-ink">Embeddings, warehouses, documents, permissions</text>
  <rect x="760" y="464" width="360" height="44" rx="22" fill="#FFFFFF"/>
  <text x="940" y="492" text-anchor="middle" class="chip" fill="#5F6368">Quality and access policy set the ceiling</text>

  <rect x="48" y="548" width="1104" height="88" rx="20" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="48" y="548" width="10" height="88" rx="2" fill="#4285F4"/>
  <circle cx="108" cy="592" r="24" fill="#E8F0FE"/>
  <g transform="translate(97,581)" fill="none" stroke="#4285F4" stroke-width="2">
    <path d="M11 2 L19 6 v5 c0 5-3.5 8-8 9 -4.5-1-8-4-8-9V6z"/>
    <path d="M8 11 l2.5 2.5 L15 9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="160" y="580" class="h2">Foundation</text>
  <text x="160" y="610" class="body-ink">Identity · network · audit · vendor trust boundaries</text>

</svg>
