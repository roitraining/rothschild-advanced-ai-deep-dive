<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="elev2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202124" flood-opacity="0.18"/>
    </filter>
            <style type="text/css"><![CDATA[
      .title { font-family: Roboto, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #202124; }
      .sub { font-family: Roboto, Arial, sans-serif; font-size: 22px; fill: #5F6368; }
      .h2 { font-family: Roboto, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #202124; }
      .h2-sm { font-family: Roboto, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 20px; fill: #5F6368; }
      .body-ink { font-family: Roboto, Arial, sans-serif; font-size: 20px; fill: #202124; }
      .num { font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFF; }
      .num-dark { font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #202124; }
      .on-dark { fill: #FFF; }
    ]]></style>
  </defs>
  <rect width="1200" height="675" fill="#F8F9FA"/>

  <text x="48" y="48" class="title">The Generative AI Stack</text>
  <text x="48" y="80" class="sub">Name each layer in vendor and architecture conversations</text>
  <rect x="48" y="100" width="1104" height="95" rx="16" fill="#E8F0FE" filter="url(#elev2)"/>
  <circle cx="100" cy="147" r="22" fill="#4285F4"/><text x="100" y="154" text-anchor="middle" class="num">01</text>
  <text x="140" y="138" class="h2">Applications and Agents</text>
  <text x="140" y="172" class="body-ink">Copilots, deal workflows, multi-agent systems</text>
  <rect x="48" y="207" width="1104" height="95" rx="16" fill="#E6F4EA" filter="url(#elev2)"/>
  <circle cx="100" cy="254" r="22" fill="#34A853"/><text x="100" y="261" text-anchor="middle" class="num">02</text>
  <text x="140" y="245" class="h2">Orchestration and Tools</text>
  <text x="140" y="279" class="body-ink">APIs, MCP, RAG, skills, guardrails</text>
  <rect x="48" y="314" width="1104" height="95" rx="16" fill="#FEF7E0" filter="url(#elev2)"/>
  <circle cx="100" cy="361" r="22" fill="#FBBC04"/><text x="100" y="368" text-anchor="middle" class="num-dark">03</text>
  <text x="140" y="352" class="h2">Model Layer</text>
  <text x="140" y="386" class="body-ink">Frontier, open-weight, specialized, multimodal</text>
  <rect x="48" y="421" width="1104" height="95" rx="16" fill="#FCE8E6" filter="url(#elev2)"/>
  <circle cx="100" cy="468" r="22" fill="#EA4335"/><text x="100" y="475" text-anchor="middle" class="num">04</text>
  <text x="140" y="459" class="h2">Data and Infrastructure</text>
  <text x="140" y="493" class="body-ink">Embeddings, warehouses, docs, permissions</text>
  <rect x="48" y="528" width="1104" height="120" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="48" y="528" width="10" height="120" fill="#4285F4"/>
  <text x="80" y="570" class="h2">Foundation — identity, network,</text>
  <text x="80" y="604" class="h2">audit, vendor trust</text>
  <text x="80" y="640" class="body">Shared controls under every layer above</text>

</svg>
