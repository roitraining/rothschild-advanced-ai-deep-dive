<text x="992" y="240" text-anchor="middle" class="body-ink">Vectors for search and RAG</text>
<rect x="48" y="350" width="1104" height="260" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
<rect x="48" y="350" width="1104" height="8" fill="#EA4335"/>
<text x="80" y="400" class="h2">Why bankers should care</text>
<text x="80" y="450" class="body-ink">Token limits decide how much of a CIM fits in one pass</text>
