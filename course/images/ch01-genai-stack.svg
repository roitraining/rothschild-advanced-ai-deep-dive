<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a2332; }
      .h { font-size: 28px; font-weight: 700; }
      .b { font-size: 18px; font-weight: 600; }
      .s { font-size: 15px; fill: #3d4a5c; }
      .w { fill: #f7f5f0; }
      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">The Generative AI Stack</text>
  <rect x="80" y="100" width="1040" height="90" rx="10" class="card"/>
  <text x="110" y="145" class="t b">Applications &amp; Agents — copilots, deal workflows, multi-agent systems</text>
  <text x="110" y="170" class="t s">Rothschild use: research briefs, dossier assembly, client communications</text>
  <rect x="80" y="210" width="1040" height="90" rx="10" class="card"/>
  <text x="110" y="255" class="t b">Orchestration &amp; Tools — APIs, MCP, RAG, skills, guardrails</text>
  <text x="110" y="280" class="t s">Where enterprise data and controls attach to the model</text>
  <rect x="80" y="320" width="1040" height="90" rx="10" class="card"/>
  <text x="110" y="365" class="t b">Model Layer — frontier / open-weight / specialized / multimodal</text>
  <text x="110" y="390" class="t s">Choose by task: reasoning depth, latency, data residency, cost</text>
  <rect x="80" y="430" width="1040" height="90" rx="10" class="card"/>
  <text x="110" y="475" class="t b">Data &amp; Infrastructure — embeddings, warehouses, docs, permissions</text>
  <text x="110" y="500" class="t s">Quality and access policy determine what the stack can safely do</text>
  <rect x="80" y="540" width="1040" height="70" rx="10" fill="#0b3d2e"/>
  <text x="110" y="583" class="t b" fill="#f7f5f0">Foundation: identity, network, audit, and vendor trust boundaries</text>

</svg>