<rect x="80" y="200" width="236" height="60" rx="12" fill="#FFFFFF"/><text x="198" y="238" text-anchor="middle" class="body-ink">"EBITDA margin"</text>
<line x1="368" y1="210" x2="408" y2="210" stroke="#4285F4" stroke-width="3"/><polygon points="420,210 406,203 406,217" fill="#4285F4"/>
