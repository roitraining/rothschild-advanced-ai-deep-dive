<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a2332; }
      .h { font-size: 28px; font-weight: 700; }
      .b { font-size: 18px; font-weight: 600; }
      .s { font-size: 15px; fill: #3d4a5c; }
      .w { fill: #f7f5f0; }
      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">Open-Weight vs Closed Models</text>
  <rect x="80" y="110" width="480" height="460" rx="12" class="card"/>
  <rect x="80" y="110" width="480" height="64" rx="12" fill="#0b3d2e"/>
  <text x="110" y="150" class="t b" fill="#f7f5f0">Open-Weight</text>
  <text x="110" y="220" class="t s">• Weights downloadable / self-hostable</text>
  <text x="110" y="255" class="t s">• Stronger control over data path</text>
  <text x="110" y="290" class="t s">• You own ops, patches, GPUs</text>
  <text x="110" y="325" class="t s">• License terms still matter</text>
  <text x="110" y="360" class="t s">• Often lags frontier capability</text>
  <text x="110" y="420" class="t b">Finance fit</text>
  <text x="110" y="455" class="t s">Sensitive workloads, air-gapped,</text>
  <text x="110" y="485" class="t s">or regulated data residency</text>
  <rect x="640" y="110" width="480" height="460" rx="12" class="card"/>
  <rect x="640" y="110" width="480" height="64" rx="12" fill="#1e5a45"/>
  <text x="670" y="150" class="t b" fill="#f7f5f0">Closed / API</text>
  <text x="670" y="220" class="t s">• Accessed via vendor API/UI</text>
  <text x="670" y="255" class="t s">• Fastest capability cadence</text>
  <text x="670" y="290" class="t s">• Vendor handles scale &amp; safety</text>
  <text x="670" y="325" class="t s">• Contract + DPA governs data</text>
  <text x="670" y="360" class="t s">• Less visibility into internals</text>
  <text x="670" y="420" class="t b">Finance fit</text>
  <text x="670" y="455" class="t s">General productivity, research,</text>
  <text x="670" y="485" class="t s">and approved enterprise copilots</text>

</svg>