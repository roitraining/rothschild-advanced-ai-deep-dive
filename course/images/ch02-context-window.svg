<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a2332; }
      .h { font-size: 28px; font-weight: 700; }
      .b { font-size: 18px; font-weight: 600; }
      .s { font-size: 15px; fill: #3d4a5c; }
      .w { fill: #f7f5f0; }
      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">Context Window = Working Memory</text>
  <rect x="80" y="120" width="1040" height="80" rx="8" fill="#0b3d2e"/>
  <text x="110" y="170" class="t b" fill="#f7f5f0">Everything the model can "see" in one request: system + tools + docs + chat</text>
  <rect x="80" y="240" width="300" height="280" rx="10" class="card"/>
  <text x="105" y="290" class="t b">Fits easily</text>
  <text x="105" y="330" class="t s">Email draft</text>
  <text x="105" y="360" class="t s">Term sheet excerpt</text>
  <text x="105" y="390" class="t s">Short memo</text>
  <rect x="420" y="240" width="300" height="280" rx="10" class="card"/>
  <text x="445" y="290" class="t b">Needs strategy</text>
  <text x="445" y="330" class="t s">50-page CIM</text>
  <text x="445" y="360" class="t s">Multi-year filings</text>
  <text x="445" y="390" class="t s">Full data room</text>
  <text x="445" y="430" class="t s">→ RAG / chunking</text>
  <rect x="760" y="240" width="360" height="280" rx="10" class="card"/>
  <text x="785" y="290" class="t b">Hallucination risk</text>
  <text x="785" y="330" class="t s">Gaps in context</text>
  <text x="785" y="360" class="t s">Stale training facts</text>
  <text x="785" y="390" class="t s">Forced completion</text>
  <text x="785" y="430" class="t s">→ Ground + cite</text>

</svg>