<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <defs>
    <filter id="elev1" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#202124" flood-opacity="0.16"/>
    </filter>
    <filter id="elev2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202124" flood-opacity="0.18"/>
    </filter>
    <style type="text/css"><![CDATA[
      .title { font-family: Roboto, 'Google Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #202124; }
      .sub { font-family: Roboto, Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #5F6368; }
      .h2 { font-family: Roboto, 'Google Sans', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #202124; }
      .h3 { font-family: Roboto, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #5F6368; }
      .body-ink { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #202124; }
      .label { font-family: Roboto, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #5F6368; letter-spacing: 1.2px; }
      .chip { font-family: Roboto, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .num { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .num-dark { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #202124; }
      .on-dark { fill: #FFFFFF; }
    ]]></style>
  </defs>
  <rect width="1200" height="675" fill="#F8F9FA"/>
  <text x="48" y="48" class="title">Context Window = Working Memory</text>
  <text x="48" y="78" class="sub">Everything the model can see in one request shares one token budget</text>

  <rect x="48" y="105" width="1104" height="96" rx="20" fill="#E8F0FE" filter="url(#elev1)"/>
  <circle cx="108" cy="153" r="30" fill="#4285F4"/>
  <g transform="translate(97,142)">
    <rect x="3" y="4" width="16" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="8" cy="11" r="1.6" fill="#fff"/><circle cx="12" cy="11" r="1.6" fill="#fff"/><circle cx="16" cy="11" r="1.6" fill="#fff"/>
    <path d="M8 11h8" stroke="#fff" stroke-width="1.5"/></g>
  <text x="160" y="145" class="h2">System + tools + docs + chat history</text>
  <text x="160" y="175" class="body-ink">They all compete for the same finite context window</text>

  <rect x="48" y="230" width="352" height="400" rx="20" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="48" y="230" width="352" height="78" rx="20" fill="#34A853"/>
  <rect x="48" y="288" width="352" height="20" fill="#34A853"/>
  <text x="224" y="278" text-anchor="middle" class="h2" fill="#fff">Fits easily</text>
<text x="88" y="350" class="body-ink" font-size="18">•  Email draft</text>
<text x="88" y="398" class="body-ink" font-size="18">•  Term sheet excerpt</text>
<text x="88" y="446" class="body-ink" font-size="18">•  Short memo</text>
  <rect x="84" y="520" width="280" height="72" rx="16" fill="#E6F4EA"/>
  <text x="224" y="564" text-anchor="middle" class="chip" fill="#34A853">Single-pass OK</text>

  <rect x="424" y="230" width="352" height="400" rx="20" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="424" y="230" width="352" height="78" rx="20" fill="#FBBC04"/>
  <rect x="424" y="288" width="352" height="20" fill="#FBBC04"/>
  <text x="600" y="278" text-anchor="middle" class="h2" fill="#202124">Needs strategy</text>
<text x="464" y="350" class="body-ink" font-size="18">•  50-page CIM</text>
<text x="464" y="398" class="body-ink" font-size="18">•  Multi-year filings</text>
<text x="464" y="446" class="body-ink" font-size="18">•  Full data room</text>
  <rect x="460" y="520" width="280" height="72" rx="16" fill="#FEF7E0"/>
  <text x="600" y="564" text-anchor="middle" class="chip" fill="#202124">Use RAG / chunking</text>

  <rect x="800" y="230" width="352" height="400" rx="20" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="800" y="230" width="352" height="78" rx="20" fill="#EA4335"/>
  <rect x="800" y="288" width="352" height="20" fill="#EA4335"/>
  <text x="976" y="278" text-anchor="middle" class="h2" fill="#fff">Hallucination risk</text>
<text x="840" y="350" class="body-ink" font-size="18">•  Gaps in context</text>
<text x="840" y="398" class="body-ink" font-size="18">•  Stale training facts</text>
<text x="840" y="446" class="body-ink" font-size="18">•  Forced completion</text>
  <rect x="836" y="520" width="280" height="72" rx="16" fill="#FCE8E6"/>
  <text x="976" y="564" text-anchor="middle" class="chip" fill="#EA4335">Ground + cite</text>

</svg>
