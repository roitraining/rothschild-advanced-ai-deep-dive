<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1a2332; }
      .h { font-size: 28px; font-weight: 700; }
      .b { font-size: 18px; font-weight: 600; }
      .s { font-size: 15px; fill: #3d4a5c; }
      .w { fill: #f7f5f0; }
      .card { fill: #ffffff; stroke: #c9c2b4; stroke-width: 2; }
      .accent { fill: #0b3d2e; }
      .accent2 { fill: #1e5a45; }
      .muted { fill: #e8e4dc; }
      .line { stroke: #0b3d2e; stroke-width: 2.5; fill: none; }
      .arrow { fill: #0b3d2e; }
    </style>
  </defs>
  <rect width="1200" height="675" class="w"/>
  
  <text x="60" y="58" class="t h">Anatomy of an Agent</text>
  <rect x="380" y="110" width="440" height="90" rx="12" fill="#0b3d2e"/>
  <text x="420" y="165" class="t b" fill="#f7f5f0">Goal / Instructions / Policy</text>
  <rect x="380" y="230" width="440" height="90" rx="12" class="card"/>
  <text x="420" y="285" class="t b">Reasoning loop (plan → act → check)</text>
  <rect x="80" y="360" width="300" height="200" rx="12" class="card"/>
  <text x="110" y="430" class="t b">Memory</text>
  <text x="110" y="470" class="t s">Session + long-term</text>
  <text x="110" y="500" class="t s">prefs / prior deals</text>
  <rect x="450" y="360" width="300" height="200" rx="12" class="card"/>
  <text x="480" y="430" class="t b">Tools &amp; Skills</text>
  <text x="480" y="470" class="t s">APIs, MCP, RAG</text>
  <text x="480" y="500" class="t s">custom procedures</text>
  <rect x="820" y="360" width="300" height="200" rx="12" class="card"/>
  <text x="850" y="430" class="t b">Guardrails</text>
  <text x="850" y="470" class="t s">AuthZ, HITL,</text>
  <text x="850" y="500" class="t s">eval &amp; logging</text>

</svg>