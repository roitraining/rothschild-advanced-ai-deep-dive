<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="elev2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202124" flood-opacity="0.18"/>
    </filter>
    <style type="text/css"><![CDATA[
      .title { font-family: Roboto, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #202124; }
      .sub { font-family: Roboto, Arial, sans-serif; font-size: 16px; fill: #5F6368; }
      .h2 { font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 15px; fill: #5F6368; }
      .body-ink { font-family: Roboto, Arial, sans-serif; font-size: 15px; fill: #202124; }
      .num { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #FFF; }
      .num-dark { font-family: Roboto, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #202124; }
      .on-dark { fill: #FFF; }
    ]]></style>
  </defs>
  <rect width="1200" height="675" fill="#F8F9FA"/>
<text x="48" y="48" class="title">Multimodal Inputs to One Reasoning Surface</text>
<rect x="48" y="120" width="240" height="200" rx="16" fill="#E8F0FE" filter="url(#elev2)"/><text x="168" y="200" text-anchor="middle" class="h2">Speech</text><text x="168" y="240" text-anchor="middle" class="body-ink">Earnings calls</text>
<rect x="328" y="120" width="240" height="200" rx="16" fill="#E6F4EA" filter="url(#elev2)"/><text x="448" y="200" text-anchor="middle" class="h2">Vision</text><text x="448" y="240" text-anchor="middle" class="body-ink">Charts and decks</text>
<rect x="608" y="120" width="240" height="200" rx="16" fill="#FEF7E0" filter="url(#elev2)"/><text x="728" y="200" text-anchor="middle" class="h2">Video</text><text x="728" y="240" text-anchor="middle" class="body-ink">CEO delivery</text>
<rect x="888" y="120" width="264" height="200" rx="16" fill="#FCE8E6" filter="url(#elev2)"/><text x="1020" y="200" text-anchor="middle" class="h2">Text</text><text x="1020" y="240" text-anchor="middle" class="body-ink">Transcripts</text>
<rect x="280" y="380" width="640" height="100" rx="16" fill="#4285F4" filter="url(#elev2)"/>
<text x="600" y="440" text-anchor="middle" class="h2 on-dark">Unified model / pipeline</text>
<rect x="200" y="520" width="800" height="100" rx="16" fill="#FFFFFF" filter="url(#elev2)"/><text x="600" y="580" text-anchor="middle" class="body-ink">Sentiment · strategic shifts · executive summary podcast</text>
</svg>