<line x1="248" y1="205" x2="262" y2="205" stroke="#4285F4" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="274,205 258,197 258,213" fill="#4285F4"/><line x1="474" y1="205" x2="488" y2="205" stroke="#4285F4" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="500,205 484,197 484,213" fill="#4285F4"/><line x1="700" y1="205" x2="714" y2="205" stroke="#4285F4" stroke-width="3.5" stroke-linecap="round"/>
