  <rect x="160" y="520" width="880" height="110" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <text x="600" y="565" text-anchor="middle" class="body-ink">Sentiment · strategic shifts ·</text>
  <text x="600" y="600" text-anchor="middle" class="body-ink">executive summary podcast</text>

