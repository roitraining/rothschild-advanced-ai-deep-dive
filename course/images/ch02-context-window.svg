  <rect x="812" y="220" width="340" height="390" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="812" y="220" width="340" height="78" rx="16" fill="#EA4335"/>
  <rect x="812" y="266" width="340" height="32" fill="#EA4335"/>
  <text x="982" y="272" text-anchor="middle" class="h2 on-dark">High risk</text>
  <text x="844" y="350" class="body-ink">Gaps in context</text>
