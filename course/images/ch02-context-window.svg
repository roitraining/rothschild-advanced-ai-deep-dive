<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="elev2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202124" flood-opacity="0.18"/>
    </filter>
            <style type="text/css"><![CDATA[
      .title { font-family: Roboto, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #202124; }
      .sub { font-family: Roboto, Arial, sans-serif; font-size: 22px; fill: #5F6368; }
      .h2 { font-family: Roboto, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #202124; }
      .h2-sm { font-family: Roboto, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 20px; fill: #5F6368; }
      .body-ink { font-family: Roboto, Arial, sans-serif; font-size: 20px; fill: #202124; }
      .num { font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFF; }
      .num-dark { font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #202124; }
      .on-dark { fill: #FFF; }
    ]]></style>
  </defs>
  <rect width="1200" height="675" fill="#F8F9FA"/>

  <text x="48" y="48" class="title">Context Window = Working Memory</text>
  <rect x="48" y="100" width="1104" height="90" rx="16" fill="#E8F0FE" filter="url(#elev2)"/>
  <text x="80" y="155" class="h2">System + tools + docs + chat compete for one budget</text>

  <rect x="48" y="220" width="340" height="390" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="48" y="220" width="340" height="78" rx="16" fill="#34A853"/>
  <rect x="48" y="266" width="340" height="32" fill="#34A853"/>
  <text x="218" y="272" text-anchor="middle" class="h2 on-dark">Fits easily</text>
  <text x="80" y="350" class="body-ink">Email draft</text>
  <text x="80" y="405" class="body-ink">Term sheet excerpt</text>
  <text x="80" y="460" class="body-ink">Short memo</text>

  <rect x="430" y="220" width="340" height="390" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="430" y="220" width="340" height="78" rx="16" fill="#FBBC04"/>
  <rect x="430" y="266" width="340" height="32" fill="#FBBC04"/>
  <text x="600" y="272" text-anchor="middle" class="h2">Needs strategy</text>
