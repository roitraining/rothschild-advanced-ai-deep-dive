<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="elev2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#202124" flood-opacity="0.18"/>
    </filter>
            <style type="text/css"><![CDATA[
      .title { font-family: Roboto, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #202124; }
      .sub { font-family: Roboto, Arial, sans-serif; font-size: 22px; fill: #5F6368; }
      .h2 { font-family: Roboto, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #202124; }
      .h2-sm { font-family: Roboto, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #202124; }
      .body { font-family: Roboto, Arial, sans-serif; font-size: 20px; fill: #5F6368; }
      .body-ink { font-family: Roboto, Arial, sans-serif; font-size: 20px; fill: #202124; }
      .num { font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #FFF; }
      .num-dark { font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #202124; }
      .on-dark { fill: #FFF; }
    ]]></style>
  </defs>
  <rect width="1200" height="675" fill="#F8F9FA"/>

  <text x="48" y="48" class="title">Anatomy of an Agent</text>
  <rect x="280" y="100" width="640" height="100" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <text x="600" y="162" text-anchor="middle" class="h2">Goal / Instructions / Policy</text>
  <rect x="280" y="230" width="640" height="120" rx="16" fill="#E8F0FE" filter="url(#elev2)"/>
  <text x="600" y="280" text-anchor="middle" class="h2">Reasoning loop</text>
  <text x="600" y="320" text-anchor="middle" class="body-ink">plan → act → observe → update</text>

  <rect x="48" y="390" width="340" height="230" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="48" y="390" width="340" height="64" rx="16" fill="#34A853"/>
  <rect x="48" y="422" width="340" height="32" fill="#34A853"/>
  <text x="218" y="432" text-anchor="middle" class="h2 on-dark">Memory</text>
  <text x="218" y="520" text-anchor="middle" class="body-ink">Session vs durable</text>

  <rect x="430" y="390" width="340" height="230" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="430" y="390" width="340" height="64" rx="16" fill="#FBBC04"/>
  <rect x="430" y="422" width="340" height="32" fill="#FBBC04"/>
  <text x="600" y="432" text-anchor="middle" class="h2">Tools and Skills</text>
  <text x="600" y="505" text-anchor="middle" class="body-ink">APIs, MCP, RAG,</text>
  <text x="600" y="540" text-anchor="middle" class="body-ink">procedures</text>

  <rect x="812" y="390" width="340" height="230" rx="16" fill="#FFFFFF" filter="url(#elev2)"/>
  <rect x="812" y="390" width="340" height="64" rx="16" fill="#EA4335"/>
  <rect x="812" y="422" width="340" height="32" fill="#EA4335"/>
  <text x="982" y="432" text-anchor="middle" class="h2 on-dark">Guardrails</text>
  <text x="982" y="520" text-anchor="middle" class="body-ink">AuthZ, HITL, evals, logs</text>

</svg>
